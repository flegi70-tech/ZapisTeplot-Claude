<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zápis teplot</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#17211b;--mu:#667a6e;--bd:#d5ded8;--ac:#16a34a;--hd:#e8efea;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131c18;--card:#1c2823;--tx:#eaf2ed;--mu:#9bb0a3;--bd:#33453b;--ac:#4ade80;--hd:#26352d;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131c18;--card:#1c2823;--tx:#eaf2ed;--mu:#9bb0a3;--bd:#33453b;--ac:#4ade80;--hd:#26352d;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:0 0 10px}
h3{font-size:1rem;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.75rem;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
button{border:0;border-radius:8px;background:var(--ac);color:#06220f;font:inherit;padding:8px 12px;cursor:pointer}
button.x{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar button.on{outline:2px solid var(--ac)}
.wh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
table{border-collapse:collapse;width:100%;table-layout:auto}
th,td{border:1px solid var(--bd);padding:3px 5px;text-align:center;font-size:.85rem;height:22px}
thead th{background:var(--hd)}
th.dd{background:var(--hd);width:56px}
td.nm{font-weight:600}
td.lo{color:var(--bad);font-weight:700}
tr[data-d]{cursor:pointer}
.sc{overflow-x:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;overflow:auto;padding:12px;z-index:5}
.ov.on{display:block}
.pop{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rc{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.rc.low{border-color:var(--bad)}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tr{display:grid;grid-template-columns:52px 96px auto 1fr auto 58px auto;gap:6px;align-items:center;margin-top:8px}
.tr input[type=time]{padding:6px}
.tr button{padding:6px 10px}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fx input{flex:1;min-width:160px}
.lo2{border-color:var(--bad)}
.ct{display:flex;gap:6px;margin-bottom:6px}
@media(max-width:560px){.tr{grid-template-columns:44px 90px auto 1fr;}.tr span,.tr .pm{justify-self:start}}
.pr{display:none}
@page{size:A4;margin:10mm}
@media print{
:root,:root[data-theme="dark"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#888;--hd:#eee;--bad:#c00;color-scheme:light}
body{background:#fff;color:#000;font-size:10px}
main{max-width:none;padding:0}
.nopr,h1,.ov{display:none!important}
.wk{break-inside:avoid;margin-bottom:8px}
h3{margin:4px 0}
th,td{font-size:10px;padding:1px 3px;height:16px}
}
</style>
</head>
<body>
<main>
<h1 class="nopr">Zápis teplot</h1>
<div class="bar nopr">
<button class="x on" id="t1">Tabulka</button>
<button class="x" id="t2">Katalog jídel</button>
<button class="x" id="t3">Nastavení</button>
<button id="pr">Tisk / PDF</button>
</div>

<div id="v1"><div class="bar nopr"><button class="x" id="mp">◄</button><b id="ml" style="align-self:center;min-width:140px;text-align:center;text-transform:capitalize"></b><button class="x" id="mx">►</button><button class="x" id="md">Dnes</button></div><div id="tb"></div></div>

<div id="v2" class="nopr" style="display:none">
<div class="card">
<div class="ct"><input id="nc" placeholder="Nové jídlo"><button id="ac">Přidat</button></div>
<div id="cl"></div>
</div>
</div>

<div id="v3" class="nopr" style="display:none">
<div class="card"><div class="g">
<div><label>Název provozovny</label><input id="pv"></div>
<div><label>Měsíc</label><input id="mo" type="month"></div>
</div>
<div style="margin-top:10px"><label>Seznam jmen (jedno na řádek)</label><textarea id="nm" rows="5"></textarea></div>
<p style="color:var(--mu);font-size:.8rem;margin:8px 0 0">Minimální teplota 63 °C. Náprava se vyplňuje jen při teplotě pod limitem. Data zůstávají jen v tomto prohlížeči.</p>
</div>
</div>

<datalist id="dl"></datalist>
</main>

<div class="ov" id="ov"><div class="pop" id="pop"></div></div>

<script>
const $=id=>document.getElementById(id);
const MN=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const LIM=63,DEF=70,MINT=60,MAXT=90;
let S={prov:'Provozovna',names:['Jméno 1'],month:'',catalog:[],days:{},locked:{}};
try{const x=JSON.parse(localStorage.getItem('zt'));if(x&&x.days)S=x}catch(e){}
if(!S.month){const n=new Date();S.month=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')}
const save=()=>{try{localStorage.setItem('zt',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const pad=n=>String(n).padStart(2,'0');
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const key=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const newRow=()=>({f:'',t1:'',c1:DEF,t2:'',c2:DEF,fix:''});
const low=r=>(r.t1&&r.c1<LIM)||(r.t2&&r.c2<LIM);

function renderTable(){
 const [y,m]=S.month.split('-').map(Number),n=new Date(y,m,0).getDate();
 let h='';
 for(let w=0,a=1;a<=n;w++,a+=7){
  const b=Math.min(a+6,n),wk=S.month+'-w'+(w+1),lk=S.locked[wk];
  h+='<section class="wk"><h3>Zápis teplot – '+esc(S.prov)+' – '+MN[m-1]+' '+y+'</h3>'+
  '<div class="wh"><b>Týden '+(w+1)+': '+a+'.–'+b+'.'+(lk?' 🔒':'')+'</b><button class="x nopr" data-lk="'+wk+'">'+(lk?'Odemknout týden':'Uzamknout týden')+'</button></div>'+
  '<div class="sc"><table><thead><tr><th>Datum</th><th>Jídlo</th><th>Čas</th><th>°C</th><th>Čas 2</th><th>°C</th><th>Náprava</th><th>Jméno</th></tr></thead><tbody>';
  for(let d=a;d<=b;d++){
   const k=key(y,m,d),day=S.days[k],rows=day?day.rows:[],cnt=Math.max(3,rows.length);
   for(let i=0;i<cnt;i++){
    const r=rows[i]||{},c1=r.t1?r.c1:'',c2=r.t2?r.c2:'';
    h+='<tr data-d="'+k+'" data-w="'+wk+'">'+(i==0?'<th class="dd" rowspan="'+cnt+'">'+d+'.'+m+'</th>':'')+
    '<td>'+esc(r.f)+'</td><td>'+esc(r.t1)+'</td><td class="'+(c1!==''&&c1<LIM?'lo':'')+'">'+c1+'</td><td>'+esc(r.t2)+'</td><td class="'+(c2!==''&&c2<LIM?'lo':'')+'">'+c2+'</td><td>'+esc(r.fix)+'</td>'+
    (i==0?'<td class="nm" rowspan="'+cnt+'">'+esc(day?day.name:'')+'</td>':'')+'</tr>';
   }
  }
  h+='</tbody></table></div></section>';
 }
 $('tb').innerHTML=h;$('ml').textContent=MN[m-1]+' '+y;
 $('dl').innerHTML=S.catalog.map(c=>'<option value="'+esc(c)+'">').join('');
}
$('tb').addEventListener('click',e=>{
 const lb=e.target.closest('[data-lk]');
 if(lb){S.locked[lb.dataset.lk]=!S.locked[lb.dataset.lk];save();renderTable();return}
 const tr=e.target.closest('tr[data-d]');if(!tr)return;
 if(S.locked[tr.dataset.w]&&!confirm('Týden je uzamčený. Přesto zapsat nebo upravit?'))return;
 openDay(tr.dataset.d);
});

let E=null;
function openDay(k){
 const day=S.days[k];
 E={k,name:day?day.name:(S.names[0]||''),rows:day?JSON.parse(JSON.stringify(day.rows)):[]};
 while(E.rows.length<3)E.rows.push(newRow());
 renderPop();$('ov').classList.add('on');
}
function trow(r,i,k){
 const t=r['t'+k],c=r['c'+k];
 return '<div class="tr"><b>Čas'+(k==2?' 2':'')+'</b><input type="time" data-f="t'+k+'" data-r="'+i+'" value="'+esc(t)+'"><button class="x" data-a="now" data-r="'+i+'" data-k="'+k+'">Teď</button>'+
 '<input type="range" min="'+MINT+'" max="'+MAXT+'" data-f="c'+k+'" data-r="'+i+'" value="'+c+'">'+
 '<span class="pm"><button class="x" data-a="adj" data-v="-1" data-r="'+i+'" data-k="'+k+'">−</button></span><b id="v'+k+'_'+i+'">'+c+' °C</b><span class="pm"><button class="x" data-a="adj" data-v="1" data-r="'+i+'" data-k="'+k+'">+</button></span></div>';
}
function renderPop(){
 const [y,m,d]=E.k.split('-').map(Number),old=$('ov').scrollTop;
 const names=S.names.slice();if(E.name&&names.indexOf(E.name)<0)names.unshift(E.name);
 let h='<div class="ph"><h2 style="margin:0;font-size:1.15rem">'+d+'. '+MN[m-1]+' '+y+'</h2><button class="x" data-a="close">Zavřít</button></div>'+
 '<label>Jméno</label><select data-f="name"><option value="">–</option>'+names.map(n=>'<option'+(n===E.name?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>';
 E.rows.forEach((r,i)=>{
  h+='<div class="rc'+(low(r)?' low':'')+'" id="rc'+i+'"><div class="rh"><b>Jídlo '+(i+1)+'</b><button class="x" data-a="del" data-r="'+i+'">Odebrat řádek</button></div>'+
  '<input list="dl" data-f="f" data-r="'+i+'" placeholder="Název jídla" value="'+esc(r.f)+'">'+trow(r,i,1)+trow(r,i,2)+
  '<div class="fx"><input data-f="fix" data-r="'+i+'" placeholder="Náprava (jen když je teplota pod limitem)" value="'+esc(r.fix)+'"><button class="x" data-a="fix" data-t="Přihřáto" data-r="'+i+'">Přihřáto</button><button class="x" data-a="fix" data-t="Přeměřeno" data-r="'+i+'">Přeměřeno</button><button class="x" data-a="clr" data-r="'+i+'">Smazat teploty</button></div></div>';
 });
 h+='<div class="fx"><button class="x" data-a="add">+ Přidat řádek</button><button class="x" data-a="yest">Jídla ze včerejška</button></div><div style="margin-top:12px"><button data-a="save">Uložit den</button></div>';
 $('pop').innerHTML=h;$('ov').scrollTop=old;
}
$('pop').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const a=b.dataset.a,i=+b.dataset.r,k=b.dataset.k;
 if(a==='close'){E=null;$('ov').classList.remove('on');return}
 if(a==='save'){
  const rows=E.rows.filter(r=>r.f.trim());
  rows.forEach(r=>{r.f=r.f.trim();if(!low(r))r.fix='';if(S.catalog.indexOf(r.f)<0)S.catalog.push(r.f)});
  if(rows.length)S.days[E.k]={name:E.name,rows};else delete S.days[E.k];
  S.catalog.sort((x,y)=>x.localeCompare(y,'cs'));
  save();E=null;$('ov').classList.remove('on');renderTable();renderCat();return;
 }
 if(a==='del')E.rows.splice(i,1);
 else if(a==='add')E.rows.push(newRow());
 else if(a==='now')E.rows[i]['t'+k]=nowT();
 else if(a==='adj')E.rows[i]['c'+k]=Math.min(MAXT,Math.max(MINT,E.rows[i]['c'+k]+Number(b.dataset.v)));
 else if(a==='fix')E.rows[i].fix=b.dataset.t;
 else if(a==='clr'){const r=E.rows[i];r.t1=r.t2=r.fix='';r.c1=r.c2=DEF}
 else if(a==='yest'){
  const [y,m,d]=E.k.split('-').map(Number),p=new Date(y,m-1,d-1),pk=key(p.getFullYear(),p.getMonth()+1,p.getDate()),pd=S.days[pk];
  if(!pd){alert('Včera nic zapsáno není.');return}
  pd.rows.forEach(pr=>{
   let t=E.rows.find(r=>!r.f.trim());
   if(!t){t=newRow();E.rows.push(t)}
   t.f=pr.f;
  });
 }
 renderPop();
});
$('pop').addEventListener('input',e=>{
 const t=e.target,f=t.dataset.f;if(!f||!E)return;
 if(f==='name'){E.name=t.value;return}
 const i=+t.dataset.r,r=E.rows[i];
 if(f==='c1'||f==='c2'){
  r[f]=Number(t.value);$('v'+f[1]+'_'+i).textContent=r[f]+' °C';
 }else r[f]=t.value;
 $('rc'+i).classList.toggle('low',!!low(r));
});

function renderCat(){
 $('cl').innerHTML=S.catalog.length?S.catalog.map((c,i)=>'<div class="ct"><input data-c="'+i+'" value="'+esc(c)+'"><button class="x" data-del="'+i+'">Smazat</button></div>').join(''):'<p style="color:var(--mu)">Katalog je prázdný. Jídla se přidají sama při uložení dne, nebo je napiš sem.</p>';
}
$('ac').onclick=()=>{
 const v=$('nc').value.trim();if(!v)return;
 if(S.catalog.indexOf(v)<0)S.catalog.push(v);
 S.catalog.sort((x,y)=>x.localeCompare(y,'cs'));$('nc').value='';save();renderCat();renderTable();
};
$('cl').addEventListener('change',e=>{
 const i=e.target.dataset.c;if(i===undefined)return;
 const o=S.catalog[i],v=e.target.value.trim();
 if(!v){e.target.value=o;return}
 Object.keys(S.days).forEach(k=>S.days[k].rows.forEach(r=>{if(r.f===o)r.f=v}));
 S.catalog[i]=v;save();renderCat();renderTable();
});
$('cl').addEventListener('click',e=>{
 const i=e.target.dataset.del;if(i===undefined)return;
 if(!confirm('Smazat jídlo z katalogu? Zápisy v tabulce zůstanou.'))return;
 S.catalog.splice(i,1);save();renderCat();renderTable();
});

function tab(n){
 [1,2,3].forEach(i=>{$('v'+i).style.display=i===n?'':'none';$('t'+i).classList.toggle('on',i===n)});
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('t3').onclick=()=>tab(3);
$('pr').onclick=()=>{tab(1);window.print()};
function mshift(n){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1);S.month=d.getFullYear()+'-'+pad(d.getMonth()+1);$('mo').value=S.month;save();renderTable()}
$('mp').onclick=()=>mshift(-1);$('mx').onclick=()=>mshift(1);
$('md').onclick=()=>{const d=new Date();S.month=d.getFullYear()+'-'+pad(d.getMonth()+1);$('mo').value=S.month;save();renderTable()};
$('pv').value=S.prov;$('mo').value=S.month;$('nm').value=S.names.join('\n');
$('pv').oninput=e=>{S.prov=e.target.value;save();renderTable()};
$('mo').onchange=e=>{if(e.target.value){S.month=e.target.value;save();renderTable()}};
$('nm').oninput=e=>{S.names=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean);save()};
renderTable();renderCat();
</script>
</body>
</html>
