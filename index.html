<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zápis teplot</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#d9e1ea;--ac:#059669;--acx:#fff;--bad:#e11d48;--warn:#d97706;--hd:#e8eef5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020617;--card:#0f172a;--tx:#e2e8f0;--mu:#94a3b8;--bd:#1e293b;--ac:#10b981;--acx:#04281c;--bad:#fb7185;--warn:#fbbf24;--hd:#162033;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#020617;--card:#0f172a;--tx:#e2e8f0;--mu:#94a3b8;--bd:#1e293b;--ac:#10b981;--acx:#04281c;--bad:#fb7185;--warn:#fbbf24;--hd:#162033;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header .t{display:flex;gap:6px;align-items:center;font-weight:700}
.mn{display:flex;gap:4px;align-items:center}
.mn select,.mn input{width:auto;padding:6px}
.mn input{width:68px}
nav{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
main{max-width:900px;margin:0 auto;padding:6px 12px 40px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
label{display:block;font-size:.78rem;color:var(--mu);margin:8px 0 3px}
button{border:0;border-radius:8px;background:var(--ac);color:var(--acx);font:inherit;padding:9px 13px;cursor:pointer}
button.x{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.on{outline:2px solid var(--ac)}
.mu{color:var(--mu)}
.dr{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;min-height:56px;margin:0 0 6px;padding:8px 12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px}
.dr .d{font-weight:700;min-width:70px}
.dr .s{flex:1;text-align:right;color:var(--mu)}
.dr.we .d{color:var(--mu)}
.dr.past.no{border-left:4px solid var(--bad)}
.dr.ok{border-left:4px solid var(--ac)}.dr.ok .s{color:var(--ac);font-weight:600}
.dr.inc{border-left:4px solid var(--warn)}.dr.inc .s{color:var(--warn);font-weight:600}
.dr.fut{opacity:.55}
.dr.today{outline:2px solid var(--ac)}
.dr small{display:block;font-weight:400;color:var(--mu)}
.wk{margin-bottom:16px}
.wk h3{margin:10px 0 4px;font-size:1rem}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--bd);padding:3px 5px;text-align:center;font-size:.85rem;height:22px}
th{background:var(--hd)}
td.dd{background:var(--hd);font-weight:700}
td.fd{text-align:left}
tr.de td{border-bottom:2px solid var(--mu)}
td.lo{color:var(--bad);font-weight:700}
.ag{margin:12px 0 4px;font-weight:700}
.ai{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;overflow:auto;padding:10px;z-index:20}
.ov.on{display:block}
#dg{z-index:30}
.sheet{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.sh,.sf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--hd)}
.sh h2{margin:0;font-size:1.1rem}
.sb{padding:12px 14px}
.sf{position:sticky;bottom:0;justify-content:flex-end}
.rc{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:12px 0}
.rc.low{border-color:var(--bad)}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:170px;overflow:auto}
.ac div{padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.ms{margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:10px}
.mt{display:flex;gap:8px;align-items:center}
.mt b{width:46px}
.mt input{width:90px;text-align:center}
.mc{display:flex;gap:6px;align-items:center;margin-top:8px}
.mc input{flex:1;padding:0}
.mc input.un{opacity:.45}
.mc button{padding:6px 11px}
.tv{min-width:62px;text-align:center}
.tv.lo{color:var(--bad)}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fx input{flex:1;min-width:150px}
button.warn{background:var(--warn);color:#111}
.req{border-color:var(--warn)!important;background:color-mix(in srgb,var(--warn) 18%,var(--bg))!important;box-shadow:0 0 0 2px var(--warn)}
.tv.req{border-radius:6px;padding:2px 4px}
.tb{width:96px;font-variant-numeric:tabular-nums}
#tp{z-index:40}
.dg.tp{max-width:320px;margin:14vh auto 0}
.wl{display:flex;position:relative;height:200px}
.wc{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;padding:80px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wc::-webkit-scrollbar{display:none}
.wc div{height:40px;line-height:40px;text-align:center;font-size:1.35rem;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.wb{position:absolute;left:0;right:0;top:80px;height:40px;border-top:2px solid var(--ac);border-bottom:2px solid var(--ac);pointer-events:none}
.rc.low .fixr input[data-f="fix"]{border-color:var(--bad)}
.dg{max-width:440px;margin:12vh auto 0;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.dg h3{margin:0 0 8px}
.dg ul{padding-left:18px;margin:6px 0}
.dg .f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
@page{size:A4;margin:10mm}
@media print{
:root,:root[data-theme="dark"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#888;--hd:#eee;--bad:#c00;color-scheme:light}
body{background:#fff;color:#000;font-size:10px}
header,nav,.ov,.nopr{display:none!important}
.view{display:none!important}
#v-over{display:block!important}
main{max-width:none;padding:0}
.wk{break-inside:avoid;margin-bottom:8px}
.wk h3{margin:3px 0;font-size:11px}
th,td{font-size:10px;padding:1px 3px;height:16px}
.sc{overflow:visible}
table{min-width:0}
body.one .wk:not(.pw){display:none!important}
}
</style>
</head>
<body>
<header>
<div class="t"><span>Zápis teplot –</span><input id="fac" style="width:150px"></div>
<div class="mn"><button class="x" id="mp">◄</button><select id="ms"></select><input id="yi" type="number"><button class="x" id="mx">►</button><button class="x" id="md">Dnes</button></div>
<button class="x" id="bs">⚙ Nastavení</button>
</header>
<nav>
<button class="x on" data-v="list">Zápis</button>
<button class="x" data-v="over">Přehled</button>
<button class="x" data-v="arch">Archiv</button>
<button id="bp">🖨 Tisk / PDF</button>
</nav>
<main>
<div class="view" id="v-list"></div>
<div class="view" id="v-over" hidden></div>
<div class="view" id="v-arch" hidden></div>
</main>

<div class="ov" id="sh"><div class="sheet">
<div class="sh"><h2 id="stt"></h2><button class="x" id="sx">Zavřít</button></div>
<div class="sb" id="sb"></div>
<div class="sf"><button class="x" id="sc">Zrušit</button><button id="sv">Uložit den</button></div>
</div></div>

<div class="ov" id="st"><div class="sheet">
<div class="sh"><h2>Nastavení</h2><button class="x" id="stx">Zavřít</button></div>
<div class="sb">
<label>Obsluha (jedno jméno na řádek)</label><textarea id="stf" rows="4"></textarea>
<label>Katalog jídel pro našeptávač (jedno jídlo na řádek)</label><textarea id="stc" rows="7"></textarea>
<div class="fx"><div style="flex:1"><label>Minimální teplota (°C)</label><input id="stl" type="number" min="0" max="100"></div><div style="flex:1"><label>Výchozí teplota posuvníku (°C)</label><input id="std" type="number" min="60" max="90"></div></div>
<p class="mu" style="font-size:.8rem">Data zůstávají jen v tomto prohlížeči.</p>
</div>
<div class="sf"><button id="stv">Uložit nastavení</button></div>
</div></div>

<div class="ov" id="dg"><div class="dg"><h3 id="dgt"></h3><div id="dgb"></div><div class="f" id="dgf"></div></div></div>

<div class="ov" id="tp"><div class="dg tp"><h3 id="tpt"></h3><div class="wl"><div class="wc" id="wh"></div><div class="wc" id="wm"></div><div class="wb"></div></div><div class="f"><button class="x" id="tpn">Teď</button><button class="x" id="tpc">Zrušit</button><button id="tpo">Hotovo</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const KEY='temperatureApp_state';
const MN=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const MNC=m=>MN[m][0].toUpperCase()+MN[m].slice(1);
const DN=['Ne','Po','Út','St','Čt','Pá','So'];
let S={facilityName:'Provozovna',currentYear:2026,currentMonth:10,staff:['Pavel Z.','Martin T.','Zachar'],catalog:['Bramboračka','Francouzské brambory','Hovězí vývar','Svíčková omáčka','Vařené brambory','Kulajda','Gulášová','Rýže'],lockedWeeks:{},data:{},limit:63,defTemp:70};
try{
 const raw=localStorage.getItem(KEY);
 if(raw)S=Object.assign(S,JSON.parse(raw));
 else{const n=new Date();S.currentYear=n.getFullYear();S.currentMonth=n.getMonth()}
}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad=n=>String(n).padStart(2,'0');
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const dk=(y,m,d)=>y+'-'+m+'-'+d;
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const validT=t=>/^([01]?\d|2[0-3]):[0-5]\d$/.test(t||'');
const normT=t=>{const m=/^(\d{1,2})[:.]?(\d{2})$/.exec((t||'').trim());return m?pad(+m[1])+':'+m[2]:(t||'').trim()};
const fv=v=>v==null||v===''?'':v;

/* dialog */
function dlg(title,html,btns){
 $('dgt').textContent=title;$('dgb').innerHTML=html;
 const f=$('dgf');f.innerHTML='';
 btns.forEach(b=>{const e=document.createElement('button');e.textContent=b.t;e.className=b.c||(b.p?'':'x');e.onclick=()=>{$('dg').classList.remove('on');if(b.f)b.f()};f.appendChild(e)});
 $('dg').classList.add('on');
}

/* views and header */
let V='list';
function show(v){
 V=v;
 ['list','over','arch'].forEach(k=>{$('v-'+k).hidden=k!==v;document.querySelector('nav [data-v="'+k+'"]').classList.toggle('on',k===v)});
 render();
}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('bp').onclick=()=>window.print();
$('ms').innerHTML=MN.map((m,i)=>'<option value="'+i+'">'+MNC(i)+'</option>').join('');
function setMonth(y,m){S.currentYear=y;S.currentMonth=m;save();render()}
$('mp').onclick=()=>{let y=S.currentYear,m=S.currentMonth-1;if(m<0){m=11;y--}setMonth(y,m)};
$('mx').onclick=()=>{let y=S.currentYear,m=S.currentMonth+1;if(m>11){m=0;y++}setMonth(y,m)};
$('md').onclick=()=>{const n=new Date();setMonth(n.getFullYear(),n.getMonth())};
$('ms').onchange=e=>setMonth(S.currentYear,+e.target.value);
$('yi').onchange=e=>setMonth(+e.target.value||S.currentYear,S.currentMonth);
$('fac').onchange=e=>{S.facilityName=e.target.value.trim()||'Provozovna';save();render()};

function render(){
 $('fac').value=S.facilityName;$('ms').value=S.currentMonth;$('yi').value=S.currentYear;
 renderList();$('v-over').innerHTML=overHtml();$('v-arch').innerHTML=archHtml();
}

/* day list */
const lowAny=r=>(r.c1!=null&&r.c1<S.limit)||(r.c2!=null&&r.c2<S.limit);
function renderList(){
 const y=S.currentYear,m=S.currentMonth,n=daysIn(y,m),td=new Date();td.setHours(0,0,0,0);
 let h='';
 for(let d=1;d<=n;d++){
  const k=dk(y,m,d),rec=S.data[k],dt=new Date(y,m,d),wd=dt.getDay(),isT=dt.getTime()===td.getTime(),fut=dt>td,past=dt<td;
  const wk=y+'-'+m+'-W'+(Math.floor((d-1)/7)+1),lk=S.lockedWeeks[wk];
  const has=rec&&((rec.foods&&rec.foods.length)||rec.staff);
  let cls='dr',st='';
  if(has&&!rec.incomplete){
   cls+=' ok';
   const warn=(rec.foods||[]).some(f=>(f.temp1!=null&&f.temp1<S.limit)||(f.temp2!=null&&f.temp2<S.limit));
   st=(isT?'Dnes jsou teploty zapsané':'Teploty zapsané')+(warn?' ⚠':'')+'<small>'+esc(rec.staff||'')+' · '+rec.foods.length+' '+(rec.foods.length===1?'jídlo':rec.foods.length<5?'jídla':'jídel')+'</small>';
  }else if(has){cls+=' inc';st='Nedokončeno – doplňte'}
  else{st=fut?'':'Kliknutím zapište';if(past)cls+=' past no'}
  if(fut)cls+=' fut';if(isT)cls+=' today';if(wd===0||wd===6)cls+=' we';
  h+='<button class="'+cls+'" data-k="'+k+'" data-w="'+wk+'"><span class="d">'+DN[wd]+' '+d+'.'+(m+1)+'.'+(lk?' 🔒':'')+'</span><span class="s">'+st+'</span></button>';
 }
 $('v-list').innerHTML=h;
}
$('v-list').addEventListener('click',e=>{
 const b=e.target.closest('.dr');if(!b)return;
 const k=b.dataset.k;
 if(S.lockedWeeks[b.dataset.w])dlg('Týden je uzamčený','Přesto zapsat nebo upravit tento den?',[{t:'Zrušit'},{t:'Upravit',p:1,f:()=>openDay(k)}]);
 else openDay(k);
});

/* overview + print */
function overHtml(){
 const y=S.currentYear,m=S.currentMonth,n=daysIn(y,m);let h='';
 for(let w=1,a=1;a<=n;w++,a+=7){
  const b=Math.min(a+6,n),wk=y+'-'+m+'-W'+w,lk=S.lockedWeeks[wk];
  h+='<section class="wk" id="wk'+w+'"><h3>Zápis teplot – '+esc(S.facilityName)+' – '+MNC(m)+' '+y+'</h3><div class="wh"><b>Týden '+w+': '+a+'.–'+b+'.'+(lk?' 🔒':'')+'</b><span class="nopr"><button class="x" data-lk="'+wk+'">'+(lk?'Odemknout týden':'Uzamknout týden')+'</button> <button class="x" data-pw="'+w+'">Tisk týdne</button></span></div><div class="sc"><table><thead><tr><th>Datum</th><th>Jídlo</th><th>Čas</th><th>°C</th><th>Čas 2</th><th>°C</th><th>Náprava</th><th>Jméno</th></tr></thead><tbody>';
  for(let d=a;d<=b;d++){
   const rec=S.data[dk(y,m,d)],foods=rec&&rec.foods&&rec.foods.length?rec.foods:[null];
   foods.forEach((f,i)=>{
    const l1=f&&f.temp1!=null&&f.temp1<S.limit,l2=f&&f.temp2!=null&&f.temp2<S.limit;
    h+='<tr'+(i===foods.length-1?' class="de"':'')+'>'+(i===0?'<td class="dd" rowspan="'+foods.length+'">'+d+'.'+(m+1)+'.</td>':'')+
    '<td class="fd">'+esc(f?f.name:'')+'</td><td>'+esc(f?f.time1:'')+'</td><td'+(l1?' class="lo"':'')+'>'+fv(f&&f.time1?f.temp1:'')+'</td><td>'+esc(f?f.time2:'')+'</td><td'+(l2?' class="lo"':'')+'>'+fv(f&&f.time2?f.temp2:'')+'</td><td>'+esc(f?f.fix:'')+'</td>'+
    (i===0?'<td rowspan="'+foods.length+'">'+esc(rec?rec.staff:'')+'</td>':'')+'</tr>';
   });
  }
  h+='</tbody></table></div></section>';
 }
 return h;
}
function printWeek(w){
 const el=$('wk'+w);if(!el)return;
 el.classList.add('pw');document.body.classList.add('one');
 const un=()=>{el.classList.remove('pw');document.body.classList.remove('one')};
 window.onafterprint=un;setTimeout(un,4000);
 window.print();
}
$('v-over').addEventListener('click',e=>{
 const l=e.target.closest('[data-lk]');
 if(l){S.lockedWeeks[l.dataset.lk]=!S.lockedWeeks[l.dataset.lk];save();render();return}
 const p=e.target.closest('[data-pw]');
 if(p)printWeek(p.dataset.pw);
});

/* archive */
function archHtml(){
 const ks=Object.keys(S.lockedWeeks).filter(k=>S.lockedWeeks[k]);
 if(!ks.length)return '<p class="mu">Zatím není uzamčen žádný týden. Uzamčené týdny se zobrazí tady.</p>';
 const g={};
 ks.forEach(k=>{const p=k.split('-'),o={y:+p[0],m:+p[1],w:+p[2].slice(1)};(g[o.y*12+o.m]=g[o.y*12+o.m]||[]).push(o)});
 let h='';
 Object.keys(g).map(Number).sort((a,b)=>b-a).forEach(id=>{
  const l=g[id].sort((a,b)=>a.w-b.w),f=l[0];
  h+='<div class="ag">'+MNC(f.m)+' '+f.y+'</div>';
  l.forEach(o=>{
   const a=(o.w-1)*7+1,b=Math.min(a+6,daysIn(o.y,o.m));
   h+='<div class="ai"><span>Týden '+o.w+': '+a+'.–'+b+'.</span><span><button class="x" data-ac="v" data-y="'+o.y+'" data-m="'+o.m+'" data-w="'+o.w+'">Zobrazit</button> <button class="x" data-ac="p" data-y="'+o.y+'" data-m="'+o.m+'" data-w="'+o.w+'">Vytisknout</button></span></div>';
  });
 });
 return h;
}
$('v-arch').addEventListener('click',e=>{
 const b=e.target.closest('[data-ac]');if(!b)return;
 S.currentYear=+b.dataset.y;S.currentMonth=+b.dataset.m;save();show('over');
 const el=$('wk'+b.dataset.w);
 if(b.dataset.ac==='p')printWeek(b.dataset.w);
 else if(el)el.scrollIntoView({block:'start'});
});

/* day sheet */
let A=null;
const newRow=()=>({name:'',t1:'',c1:null,t2:'',c2:null,fix:''});
function openDay(k){
 const rec=S.data[k];
 A={k,staff:rec?rec.staff||'':'',rows:rec&&rec.foods?rec.foods.map(f=>({name:f.name||'',t1:f.time1||'',c1:f.temp1==null?null:f.temp1,t2:f.time2||'',c2:f.temp2==null?null:f.temp2,fix:f.fix||''})):[]};
 if(!A.rows.length)A.rows.push(newRow());
 renderSheet();$('sh').classList.add('on');$('sb').scrollTop=0;
}
function closeSheet(){$('sh').classList.remove('on');A=null}
function meas(r,i,k){
 const t=r['t'+k],c=r['c'+k],u=c==null;
 return '<div class="ms"><div class="mt"><b>'+(k===2?'Čas 2':'Čas')+'</b><button class="x tb" data-a="tp" data-f="t'+k+'" data-r="'+i+'" data-k="'+k+'">'+esc(t||'--:--')+'</button><button class="x" data-a="now" data-r="'+i+'" data-k="'+k+'">Teď</button></div>'+
 '<div class="mc"><input type="range" class="'+(u?'un':'')+'" min="60" max="90" value="'+(u?S.defTemp:c)+'" data-f="c'+k+'" data-r="'+i+'"><button class="x" data-a="adj" data-v="-1" data-r="'+i+'" data-k="'+k+'">−</button><b class="tv'+(!u&&c<S.limit?' lo':'')+'" id="tv'+k+'_'+i+'">'+(u?'–':c+' °C')+'</b><button class="x" data-a="adj" data-v="1" data-r="'+i+'" data-k="'+k+'">+</button></div></div>';
}
function rowHtml(r,i){
 return '<div class="rc'+(lowAny(r)?' low':'')+'" id="rc'+i+'"><div class="rh"><b>Jídlo '+(i+1)+'</b><button class="x" data-a="del" data-r="'+i+'">Odebrat řádek</button></div>'+
 '<div class="acw"><input data-f="name" data-r="'+i+'" autocomplete="off" placeholder="Název jídla (začněte psát…)" value="'+esc(r.name)+'"><div class="ac" hidden></div></div>'+
 meas(r,i,1)+meas(r,i,2)+
 '<div class="fixr"><label>Náprava (povinná při teplotě pod '+S.limit+' °C)</label><div class="fx"><input data-f="fix" data-r="'+i+'" placeholder="Popis zásahu…" value="'+esc(r.fix)+'"><button class="x" data-a="fix" data-t="Přihřáto" data-r="'+i+'">Přihřáto</button><button class="x" data-a="fix" data-t="Přeměřeno" data-r="'+i+'">Přeměřeno</button><button class="x" data-a="fix" data-t="" data-r="'+i+'">Smazat</button></div></div></div>';
}
function renderSheet(){
 const p=A.k.split('-'),sc=$('sb').scrollTop;
 $('stt').textContent=p[2]+'. '+MN[+p[1]]+' '+p[0];
 const names=S.staff.slice();if(A.staff&&names.indexOf(A.staff)<0)names.push(A.staff);
 let h='<label>Jméno odpovědné osoby</label><select data-f="staff"><option value="">– vyberte jméno –</option>'+names.map(n=>'<option'+(n===A.staff?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>';
 A.rows.forEach((r,i)=>h+=rowHtml(r,i));
 h+='<div class="fx"><button class="x" data-a="add">+ Přidat jídlo</button><button class="x" data-a="yest">Jídla ze včerejška</button></div>';
 $('sb').innerHTML=h;$('sb').scrollTop=sc;hl();
}
const q=(i,f)=>$('sb').querySelector('[data-f="'+f+'"][data-r="'+i+'"]');
function setC(i,k,v){
 const r=A.rows[i];r['c'+k]=v;
 const s=q(i,'c'+k);s.value=v;s.classList.remove('un');
 const t=$('tv'+k+'_'+i);t.textContent=v+' °C';t.classList.toggle('lo',v<S.limit);
 $('rc'+i).classList.toggle('low',lowAny(r));hl();
}
$('sb').addEventListener('click',e=>{
 const pk=e.target.closest('[data-pick]');
 if(pk){const i=+pk.dataset.r;A.rows[i].name=pk.dataset.pick;q(i,'name').value=pk.dataset.pick;pk.parentNode.hidden=true;return}
 const b=e.target.closest('button');if(!b)return;
 const a=b.dataset.a,i=+b.dataset.r,k=b.dataset.k;
 if(a==='add'){A.rows.push(newRow());renderSheet()}
 else if(a==='del'){A.rows.splice(i,1);if(!A.rows.length)A.rows.push(newRow());renderSheet()}
 else if(a==='tp'){openTp(i,k)}
 else if(a==='now'){const v=nowT();A.rows[i]['t'+k]=v;q(i,'t'+k).textContent=v;hl()}
 else if(a==='adj'){const c=A.rows[i]['c'+k],base=c==null?S.defTemp:c;setC(i,k,Math.min(90,Math.max(60,base+Number(b.dataset.v))))}
 else if(a==='fix'){A.rows[i].fix=b.dataset.t;q(i,'fix').value=b.dataset.t;hl()}
 else if(a==='yest'){
  const p=A.k.split('-').map(Number),pd=new Date(p[0],p[1],p[2]-1),pr=S.data[dk(pd.getFullYear(),pd.getMonth(),pd.getDate())];
  if(!pr||!pr.foods||!pr.foods.length){dlg('Včera nic není','Ze včerejšího dne nejsou žádná jídla.',[{t:'Zavřít',p:1}]);return}
  A.rows=A.rows.filter(r=>r.name.trim()||r.t1||r.t2||r.c1!=null||r.c2!=null);
  pr.foods.forEach(f=>{if(!A.rows.some(r=>r.name.trim().toLowerCase()===f.name.toLowerCase())){const r=newRow();r.name=f.name;A.rows.push(r)}});
  renderSheet();
 }
});
$('sb').addEventListener('input',e=>{
 const t=e.target,f=t.dataset.f;if(!f)return;
 if(f==='staff'){A.staff=t.value;hl();return}
 const i=+t.dataset.r;
 if(f==='c1'||f==='c2'){setC(i,f[1],+t.value);return}
 A.rows[i][f]=t.value;
 if(f==='name'){
  const v=t.value.trim().toLowerCase(),dd=t.nextElementSibling;
  const m=v?S.catalog.filter(c=>c.toLowerCase().includes(v)&&c.toLowerCase()!==v).slice(0,8):[];
  dd.innerHTML=m.map(c=>'<div data-pick="'+esc(c)+'" data-r="'+i+'">'+esc(c)+'</div>').join('');
  dd.hidden=!m.length;
 }
 if(f==='fix')$('rc'+i).classList.toggle('low',lowAny(A.rows[i]));hl();
});
$('sb').addEventListener('change',e=>{
 const t=e.target,f=t.dataset.f;if(!f)return;
 if(f==='staff'){A.staff=t.value;hl();return}
 if(f==='t1'||f==='t2'){const i=+t.dataset.r,v=normT(t.value);t.value=v;A.rows[i][f]=v}
});
document.addEventListener('click',e=>{if(!e.target.closest('.acw'))document.querySelectorAll('.ac').forEach(x=>x.hidden=true)});

/* time wheel */
let TP=null;
$('wh').innerHTML=Array.from({length:24},(_,i)=>'<div>'+pad(i)+'</div>').join('');
$('wm').innerHTML=Array.from({length:60},(_,i)=>'<div>'+pad(i)+'</div>').join('');
function openTp(i,k){
 const m=/^(\d{1,2}):(\d{2})$/.exec(A.rows[i]['t'+k]||'');
 TP={i,k};$('tpt').textContent=(k==2?'Čas 2':'Čas')+' – jídlo '+(i+1);
 $('tp').classList.add('on');
 $('wh').scrollTop=(m?+m[1]:new Date().getHours())*40;
 $('wm').scrollTop=(m?+m[2]:0)*40;
}
const wv=(el,mx)=>Math.min(mx,Math.max(0,Math.round(el.scrollTop/40)));
$('tpn').onclick=()=>{const n=new Date();$('wh').scrollTop=n.getHours()*40;$('wm').scrollTop=n.getMinutes()*40};
$('tpc').onclick=()=>{$('tp').classList.remove('on');TP=null};
$('tpo').onclick=()=>{
 if(!TP||!A)return;
 const v=pad(wv($('wh'),23))+':'+pad(wv($('wm'),59));
 A.rows[TP.i]['t'+TP.k]=v;q(TP.i,'t'+TP.k).textContent=v;
 $('tp').classList.remove('on');TP=null;hl();
};

/* highlight of required fields (after a failed save) */
const isEmpty=r=>!r.name.trim()&&!r.t1&&!r.t2&&r.c1==null&&r.c2==null&&!r.fix.trim();
function hl(){
 if(!A||!A.hl)return;
 const sb=$('sb'),st=sb.querySelector('[data-f="staff"]');
 if(st)st.classList.toggle('req',!A.staff);
 const allEmpty=A.rows.every(isEmpty);let anyName=false;
 A.rows.forEach((r,i)=>{
  const act=!isEmpty(r)||(i===0&&allEmpty);
  const mark=(e,on)=>{if(e)e.classList.toggle('req',act&&on)};
  mark(q(i,'name'),!r.name.trim());
  mark(q(i,'t1'),!validT(r.t1));mark(q(i,'t2'),!validT(r.t2));
  mark($('tv1_'+i),r.c1==null);mark($('tv2_'+i),r.c2==null);
  mark(q(i,'fix'),lowAny(r)&&!r.fix.trim());
  if(r.name.trim())anyName=true;
 });
 const ab=sb.querySelector('[data-a="add"]');
 if(ab)ab.classList.toggle('req',!anyName);
}

/* validation and save */
function check(){
 const issues=[],clean=[];
 A.rows.forEach((r,i)=>{
  if(!r.name.trim()&&!r.t1&&!r.t2&&r.c1==null&&r.c2==null&&!r.fix.trim())return;
  const lab=r.name.trim()||('Jídlo '+(i+1)),miss=[];
  if(!r.name.trim())miss.push('název jídla');
  if(!validT(r.t1))miss.push(r.t1?'čas ve tvaru HH:MM':'čas');
  if(r.c1==null)miss.push('teplota');
  if(!validT(r.t2))miss.push(r.t2?'čas 2 ve tvaru HH:MM':'čas 2');
  if(r.c2==null)miss.push('teplota 2');
  if(lowAny(r)&&!r.fix.trim())miss.push('náprava (teplota pod '+S.limit+' °C)');
  if(miss.length)issues.push(lab+': chybí '+miss.join(', '));
  clean.push(r);
 });
 if(!A.staff)issues.unshift('Jméno odpovědné osoby není vybráno');
 if(!clean.length)issues.push('Není zapsáno žádné jídlo');
 return{issues,clean};
}
function trySave(){
 const{issues,clean}=check();
 if(issues.length){
  A.hl=true;hl();
  dlg('Něco chybí','<ul>'+issues.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>',[{t:'Uložit rozpracované',f:()=>saveDay(true)},{t:'Zpět a doplnit',c:'warn',f:()=>{const x=$('sb').querySelector('.req');if(x)x.scrollIntoView({block:'center'})}}]);
  return;
 }
 const sm=clean.map(r=>'<li><b>'+esc(r.name.trim())+'</b>: '+r.t1+' – '+r.c1+' °C, '+r.t2+' – '+r.c2+' °C'+(lowAny(r)?' (náprava: '+esc(r.fix.trim())+')':'')+'</li>').join('');
 dlg('Opravdu je vše vyplněno?','<div class="mu">'+esc(A.staff)+'</div><ul>'+sm+'</ul>',[{t:'Zpět'},{t:'Ano, uložit',p:1,f:()=>saveDay(false)}]);
}
function saveDay(inc){
 const{clean}=check();
 const foods=clean.map(r=>({name:r.name.trim(),time1:r.t1,temp1:r.c1,time2:r.t2,temp2:r.c2,fix:lowAny(r)?r.fix.trim():''}));
 foods.forEach(f=>{if(f.name&&!S.catalog.some(c=>c.toLowerCase()===f.name.toLowerCase()))S.catalog.push(f.name)});
 if(foods.length||A.staff)S.data[A.k]={staff:A.staff,foods,incomplete:!!inc};
 else delete S.data[A.k];
 save();closeSheet();render();
}
$('sv').onclick=trySave;
$('sx').onclick=closeSheet;$('sc').onclick=closeSheet;

/* settings */
$('bs').onclick=()=>{
 $('stf').value=S.staff.join('\n');$('stc').value=S.catalog.join('\n');
 $('stl').value=S.limit;$('std').value=S.defTemp;
 $('st').classList.add('on');
};
$('stx').onclick=()=>$('st').classList.remove('on');
$('stv').onclick=()=>{
 S.staff=$('stf').value.split('\n').map(s=>s.trim()).filter(Boolean);
 S.catalog=$('stc').value.split('\n').map(s=>s.trim()).filter(Boolean);
 S.limit=Math.min(100,Math.max(0,+$('stl').value||63));
 S.defTemp=Math.min(90,Math.max(60,+$('std').value||70));
 save();$('st').classList.remove('on');render();
};

render();
const tr=document.querySelector('.dr.today');
if(tr)tr.scrollIntoView({block:'center'});
</script>
</body>
</html>
